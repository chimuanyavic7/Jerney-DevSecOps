# ---- Backend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.app_name }} 
  namespace: {{ .Values.namespace }} 
  labels:
    app.kubernetes.io/name: {{ .Values.backend.app_name }} 
    app.kubernetes.io/part-of: {{ .Values.namespace }}
    app.kubernetes.io/component: {{ .Values.backend.app_component }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.backend.app_name }}
  template:
    metadata:
      labels:_
        app.kubernetes.io/name: {{ .Values.backend.app_name }}
        app.kubernetes.io/part-of:  {{ .Values.namespace }}
        app.kubernetes.io/component: {{ .Values.backend.app_component }}
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for jerney-db:5432..."
              until nc -z jerney-db 5432; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready!"
      containers:
        - name: {{ .Values.backend.app_name }}
          image: "{{ .Values.backend.image_name }}:{{ .Values.backend.image_tag }}"
          ports:
            - containerPort: {{ .Values.backend.containerport }}
              protocol: TCP
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "jerney-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: jerney-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jerney-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: jerney-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "250Mi"
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3




---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.app_name }} 
  namespace: {{ .Values.backend.namespace }} 
  labels:
    app.kubernetes.io/name: {{ .Values.backend.app_name }} 
    app.kubernetes.io/part-of:  {{ .Values.namespace }} 
    app.kubernetes.io/component: {{ .Values.backend.app_component }} 
spec:
  type: {{ .Values.backend.type }} 
  selector:
    app.kubernetes.io/name: {{ .Values.backend.app_name }} 
  ports:
    - port: {{ .Values.backend.service_port }} 
      targetPort: {{ .Values.backend.targetPort }} 
      protocol: TCP


