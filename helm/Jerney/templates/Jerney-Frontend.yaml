

# ---- Frontend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.app_name }} 
  namespace:  {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.frontend.app_name }}
    app.kubernetes.io/part-of: {{ .Values.namespace }}
    app.kubernetes.io/component: {{ .Values.frontend.app_component }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.frontend.app_name }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.frontend.app_name }}
        app.kubernetes.io/part-of: {{ .Values.frontend.app_part }}
        app.kubernetes.io/component: {{ .Values.frontend.app_component }}
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: {{ .Values.frontend.app_name }}
          image: "{{ .Values.frontend.image_name }}:{{ .Values.frontend.image_tag }}"
          ports:
            - containerPort: {{ .Values.frontend.containerport }}
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "200Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Nginx needs write for cache/pid
            runAsNonRoot: true
            runAsUser: 101 # nginx user UID in alpine
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5


---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.app_name }} 
  namespace: {{ .Values.frontend.namespace }} 
  labels:
    app.kubernetes.io/name: {{ .Values.frontend.app_name }} 
    app.kubernetes.io/part-of: {{ .Values.namespace }} 
    app.kubernetes.io/component: {{ .Values.frontend.app_component }} 
spec:
  type: {{ .Values.frontend.type }} 
  selector:
    app.kubernetes.io/name: {{ .Values.frontend.app_name }} 
  ports:
    - port: {{ .Values.frontend.service_port }} 
      targetPort: {{ .Values.frontend.targetPort }} 
      protocol: TCP

